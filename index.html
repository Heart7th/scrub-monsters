<style>
:root{--pink:#ff86b0;--pink2:#e8649a;--mint:#5fcfab;--mint2:#3eae8b;--lav:#b29cff;--lav2:#8f78ea;--ink:#5a3b5c;--cream:#fffaf6;--sun:#ffd36b;--sun2:#ebae40;--sky:#86c3ff;--sky2:#5a9fe8;--grey:#c3b9d1;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ff;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;padding:0;background:none}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:120px;height:52px;padding:0 22px;border-radius:26px;font-size:19px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(90,30,70,.18);background:var(--pink);box-shadow:inset 0 3px 0 rgba(255,255,255,.32),0 5px 0 var(--pink2),0 9px 18px rgba(150,60,110,.22);transition:transform .08s,box-shadow .08s;letter-spacing:.5px;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink2),0 4px 10px rgba(120,40,70,.2)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint2),0 9px 18px rgba(30,110,80,.25)}
.btn.mint:active{box-shadow:0 1px 0 var(--mint2)}
.btn.sun{background:var(--sun);color:#7a4a00;text-shadow:none;box-shadow:0 5px 0 var(--sun2),0 9px 18px rgba(150,100,10,.25)}
.btn.sun:active{box-shadow:0 1px 0 var(--sun2)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--sky2),0 9px 18px rgba(30,80,150,.25)}
.btn.sky:active{box-shadow:0 1px 0 var(--sky2)}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 5px 0 #e3d7e6,0 9px 18px rgba(80,40,80,.12)}
.btn.ghost:active{box-shadow:0 1px 0 #e3d7e6}
.btn.small{height:42px;min-width:0;font-size:16px;padding:0 16px;border-radius:21px}
.btn.pink{background:var(--pink);box-shadow:inset 0 3px 0 rgba(255,255,255,.32),0 5px 0 var(--pink2),0 9px 18px rgba(150,60,110,.22)}
.btn.lav{background:var(--lav);box-shadow:inset 0 3px 0 rgba(255,255,255,.32),0 5px 0 var(--lav2),0 9px 18px rgba(90,60,160,.22)}
.btn.lav:active{box-shadow:0 1px 0 var(--lav2)}
.btn.lav .ad{color:var(--lav2)}
.dot{position:absolute;top:-4px;right:-3px;width:14px;height:14px;border-radius:50%;background:#ff5a8a;box-shadow:0 0 0 3px #fff;animation:breathe 1.2s ease-in-out infinite}
.btn .ad{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:6px;background:rgba(255,255,255,.9);color:var(--pink2);font-size:11px;font-weight:900}
.btn.sun .ad{color:var(--sun2)}
.btn.mint .ad{color:var(--mint2)}
.btn.sky .ad{color:var(--sky2)}
.btn[disabled]{filter:grayscale(.8) brightness(1.05);opacity:.6;pointer-events:none}
/* ---------------- HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:calc(var(--safeT) + 8px);display:flex;align-items:center;gap:8px;padding:0 10px}
.ib{pointer-events:auto;width:44px;height:44px;border-radius:15px;background:#fff;box-shadow:0 4px 0 #e6d6e2,0 6px 14px rgba(80,40,80,.15);display:flex;align-items:center;justify-content:center}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #e6d6e2}
.ib svg{width:24px;height:24px}
.title{flex:1;min-width:0;text-align:center;line-height:1.15}
#lvTitle{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 #e0679a,2px 0 0 #e0679a,-2px 0 0 #e0679a,0 -2px 0 #e0679a,1.5px 1.5px 0 #e0679a,-1.5px 1.5px 0 #e0679a,1.5px -1.5px 0 #e0679a,-1.5px -1.5px 0 #e0679a,0 5px 8px rgba(160,60,110,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 4px}
#lvSub{margin-top:3px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff;background:rgba(150,110,170,.45);border-radius:10px;padding:2px 9px;white-space:nowrap}
.tag{border-radius:7px;padding:0 6px;font-size:11px;line-height:16px}
.tag.hard{background:#ff7092}.tag.relax{background:#5fcfab}.tag.tutorial{background:#86c3ff}.tag.normal{background:rgba(255,255,255,.25)}
.coins{pointer-events:auto;position:relative;cursor:pointer;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 6px;border-radius:19px;background:rgba(255,255,255,.92);box-shadow:0 4px 0 #f0d9e8;font-weight:900;font-size:17px;min-width:76px}
.coins:active{transform:translateY(2px)}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c4 0 18%,#ffd34d 20% 62%,#e8a21a 64%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);flex:none}
#progWrap{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safeT) + 60px);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:14px;padding:4px 12px 4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:13px;font-weight:800;white-space:nowrap}
#progWrap .bar{width:110px;height:10px;border-radius:5px;background:#f1e3ec;overflow:hidden}
#progWrap .bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#9ed2ff,#b8a6ff,#ff9ec4,#ffd98a);transition:width .3s}
#progWrap .cupico{width:20px;height:20px;background:radial-gradient(circle at 50% 50%,#fff 0 22%,transparent 24%),conic-gradient(from 45deg,#ffd34d,#ff9ccc,#7fd6ff,#a6e05a,#ffd34d);border-radius:50%;box-shadow:0 0 0 2px #fff}
#hud .bottom{position:absolute;left:0;right:0;bottom:calc(var(--safeB) + 12px);display:flex;justify-content:center;gap:12px;padding:0 10px}
.tool{pointer-events:auto;position:relative;width:76px;height:72px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #e6d6e2,0 8px 16px rgba(80,40,80,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:900}
.tool:active{transform:translateY(4px);box-shadow:0 1px 0 #e6d6e2}
.tool svg{width:30px;height:30px}
.tool em{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;font-style:normal;font-size:13px;line-height:24px;color:#fff;background:var(--pink);box-shadow:0 2px 0 var(--pink2)}
.tool em.ad{background:var(--sky);box-shadow:0 2px 0 var(--sky2);font-size:10px}
.tool.on{background:#fff4c2;box-shadow:0 5px 0 #f0d77a,0 0 0 3px #ffc94d}
.tool.lit{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
#tip{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safeT) + 98px);width:max-content;max-width:min(94vw,440px);display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 4px 0 #f0dce6,0 8px 18px rgba(80,40,80,.15);font-size:15px;font-weight:700;line-height:1.35;animation:tipin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tipin{from{transform:translate(-50%,-10px) scale(.8);opacity:0}}
.catface{flex:none;width:38px;height:36px;margin-top:4px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#c98d5c,#8a5532 70%);position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.catface:before{content:"";position:absolute;left:15px;top:-9px;width:10px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8a5532;transform:rotate(-12deg)}
.catface i{position:absolute;top:12px;width:9px;height:10px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px #2b1d33}
.catface i:after{content:"";position:absolute;left:2px;top:2px;width:5px;height:6px;border-radius:50%;background:#2b1d33}
.catface i:first-child{left:7px}.catface i:last-child{right:7px}
.catface b{position:absolute;left:14px;right:14px;bottom:7px;height:5px;border-bottom:2.5px solid #5a1f33;border-radius:0 0 8px 8px}
#aimBar{position:absolute;left:50%;bottom:calc(var(--safeB) + 98px);transform:translateX(-50%);background:#ffc94d;color:#6b4300;font-weight:900;border-radius:16px;padding:8px 16px;box-shadow:0 4px 0 #e8a21a;font-size:15px;white-space:nowrap;pointer-events:auto}
#pointer{position:absolute;width:56px;height:56px;margin:-6px 0 0 -18px;pointer-events:none;z-index:30;animation:poke 0.9s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
@keyframes poke{50%{transform:translateY(12px) scale(.94)}}
#peek{position:absolute;pointer-events:none;transform:translate(-50%,-115%);background:#fff;border-radius:14px;padding:6px 12px;font-size:14px;font-weight:900;white-space:nowrap;max-width:calc(100vw - 16px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 0 #e6d6e2,0 6px 16px rgba(0,0,0,.15);z-index:25}
#peek:after{content:"";position:absolute;left:calc(50% + var(--tail,0px));bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
#peek.bad{color:#b0405e}
/* ---------------- 首页 */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--safeT) + 40px) 20px calc(var(--safeB) + 34px);pointer-events:none}
.screen>*{pointer-events:auto}
#home{background:linear-gradient(180deg,rgba(236,228,255,.65),rgba(236,228,255,0) 40%,rgba(255,236,246,0) 62%,rgba(255,236,246,.75))}
.logo{text-align:center;pointer-events:none}
.logo h1{margin:0;font-size:48px;font-weight:900;letter-spacing:3px;color:#fff;-webkit-text-stroke:2px #ef77a6;text-shadow:0 5px 0 #ef77a6,0 10px 18px rgba(170,80,140,.3);transform:rotate(-3deg)}
.logo h1 small{display:block;font-size:18px;letter-spacing:6px;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 0 #9b84ea,0 4px 8px rgba(110,80,180,.3);margin-top:2px}
.logo p{margin:10px 0 0;font-size:15px;font-weight:800;color:#8a5c8e;background:rgba(255,255,255,.85);display:inline-block;padding:4px 14px;border-radius:12px}
.homeBtns{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.homeBtns .btn.big{min-width:230px;height:62px;font-size:23px;border-radius:31px}
.homeRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.homeRow .btn{position:relative}
/* ---------------- 弹窗 */
.mask{position:absolute;inset:0;background:rgba(90,60,110,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{width:min(100%,380px);max-height:calc(100% - 24px);overflow:auto;background:var(--cream);border-radius:28px;padding:22px 20px 20px;text-align:center;box-shadow:0 0 0 4px #fff,0 10px 0 4px #f6d6e6,0 24px 50px rgba(90,40,90,.3);animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{margin:0 0 6px;font-size:25px;font-weight:900;color:#e8649a}
.card p{margin:6px 0;font-size:15px;line-height:1.55;font-weight:600;color:#6b5068}
.card .big{font-size:42px;font-weight:900;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.card .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.card .col{display:flex;flex-direction:column;gap:12px;align-items:stretch;margin-top:16px}
.card .note{font-size:12px;color:#9a8597;margin-top:12px;font-weight:600}
.stats{display:flex;justify-content:center;gap:10px;margin:10px 0 4px}
.stat{background:#fff;border-radius:14px;padding:8px 10px;min-width:74px;box-shadow:0 3px 0 #f0dce6}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:12px;font-weight:700;color:#9a8597}
.chapter{text-align:left;margin:14px 0 4px}
.chapter h3{margin:0 0 8px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.chapter h3 span{font-size:12px;color:#fff;background:var(--mint);border-radius:8px;padding:1px 8px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{height:48px;border-radius:14px;background:#fff;font-weight:900;font-size:18px;box-shadow:0 4px 0 #ecd9e3;position:relative}
.lv.done{background:#d8f5e8;box-shadow:0 4px 0 #a9e2c8}
.lv.cur{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink2)}
.lv.lock{background:#efe9f1;color:#c2b8c8;box-shadow:0 4px 0 #e0d6e3}
.lv.hard:after{content:"难";position:absolute;top:-6px;right:-4px;font-size:10px;background:#ff5c5c;color:#fff;border-radius:6px;padding:0 4px;line-height:15px}
.lv.relax:after{content:"爽";position:absolute;top:-6px;right:-4px;font-size:10px;background:#4fc7a1;color:#fff;border-radius:6px;padding:0 4px;line-height:15px}
.shopItem{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:0 3px 0 #f0dce6;text-align:left}
.shopItem .ico{width:46px;height:46px;border-radius:14px;background:#fff1f7;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;object-fit:contain;padding:2px}
.shopItem .txt{flex:1;min-width:0}
.shopItem .txt b{display:block;font-size:16px}
.shopItem .txt span{font-size:12px;color:#9a8597;font-weight:600}
.shopItem .txt small{font-size:11px;color:#b39fb8;font-weight:700;margin-left:4px}
.shopItem .buy{flex:none;display:flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 6px;border-radius:18px;background:var(--sun);color:#7a4a00;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--sun2)}
.shopItem .buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun2)}
.shopItem .buy .coin{width:20px;height:20px}
.shopItem .buy[disabled]{filter:grayscale(.7);opacity:.5}
.shopItem .buy.owned{background:#e6f8ef;color:#3a9c7b;box-shadow:0 3px 0 #c3ead7;padding:0 12px;filter:none;opacity:1}
.shopH{margin:16px 0 4px;text-align:left;font-size:16px;font-weight:900}
.card.shop .shopList,.album{max-height:min(54vh,520px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;margin:6px -8px 0;padding:2px 8px 6px}
.wallet{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:4px 14px 4px 6px;font-weight:900;font-size:18px;box-shadow:0 3px 0 #f0dce6}
/* 结算：像素图恢复成插画 */
.revealSlot{display:flex;justify-content:center;margin:4px 0 0}
.reveal{position:relative;border-radius:16px;overflow:hidden}
.reveal canvas{display:block}
.reveal.done{animation:pop2 .5s cubic-bezier(.2,1.6,.4,1)}
.reveal.done:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 43%,rgba(255,255,255,.8) 50%,transparent 57%);transform:translateX(-70%);animation:shineSweep 1s ease-out forwards;pointer-events:none}
@keyframes shineSweep{to{transform:translateX(70%)}}
@keyframes pop2{40%{transform:scale(1.07)}}
.thingName{font-size:20px;font-weight:900;color:#e8649a;margin:6px 0 0;opacity:0;transform:scale(.6);transition:opacity .3s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.thingName small{display:block;font-size:12px;font-weight:700;color:#a68fb0;margin-top:1px}
.card.restored .thingName{opacity:1;transform:none}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chips span{background:#fff;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;color:#9a8597;box-shadow:0 2px 0 #f2e2ee}
.chips b{color:var(--ink);font-size:15px;font-weight:900}
.card.result .big{font-size:36px;margin:4px 0}
.goShop{display:flex;align-items:center;gap:8px;margin:6px auto 0;padding:6px 14px 6px 6px;white-space:nowrap;border-radius:16px;background:#fff0f6;color:#d8507f;font-weight:800;font-size:14px;line-height:1.3;text-align:left;box-shadow:0 3px 0 #f6cddd;animation:breathe 1.4s ease-in-out infinite}
.goShop img{width:30px;height:30px;flex:none}
.hintline{font-size:13px!important;color:#a08ea6!important;margin:4px 0 0!important}
/* 焕新相册 */
.card.albumCard{width:min(100%,400px)}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alb{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:16px;padding:8px 4px 6px;box-shadow:0 3px 0 #f0dce6;font-size:12px;font-weight:800;color:#b3a3ba;min-width:0}
.alb .pic{width:74px;height:74px;display:flex;align-items:center;justify-content:center}
.alb img{max-width:74px;max-height:74px;object-fit:contain}
.alb.done{color:var(--ink)}
.alb.done .pic{filter:drop-shadow(0 4px 4px rgba(120,80,120,.15))}
.alb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card.photo h2{margin-bottom:8px}
.setRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:800;box-shadow:0 3px 0 #f0dce6}
.setRow>span{white-space:nowrap}
.sw{width:52px;height:30px;border-radius:15px;background:#e3d9e6;position:relative;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--mint)}.sw.on:after{left:25px}
.seg{display:flex;gap:4px;background:#f1e8f2;border-radius:12px;padding:3px}
.seg button{padding:5px 10px;border-radius:9px;font-weight:800;font-size:13px;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 2px 0 #e3d7e6}
.card.meet h2{color:#3eae8b}
.pairRow{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 0 2px}
.pairRow img{width:128px;height:128px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(60,40,60,.18))}
.pairRow .eq{font-size:28px;font-weight:900;color:#c9b8c6}
.who{font-size:18px!important;margin:4px 0 8px!important}
.same{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 #f0dce6;font-size:14px;font-weight:700;color:#6b5068}
.same span{display:flex;align-items:center;gap:8px;line-height:1.35}
.same i{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.same img{flex:none;width:24px;height:24px}
.guideItem{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px 10px 6px 4px;margin:8px 0;box-shadow:0 3px 0 #f0dce6;text-align:left}
.guideItem>img{width:62px;height:62px;object-fit:contain;flex:none}
.guideItem>img.sw{width:54px;height:54px}
.guideItem .txt{flex:1;min-width:0}
.guideItem .txt b{display:block;font-size:16px}
.guideItem .txt>span{display:flex;align-items:center;gap:4px;font-size:12px;color:#9a8597;font-weight:700;margin-top:2px}
.guideItem .mini{width:18px;height:18px}
.guideItem.locked{opacity:.65}
.guideItem .q{width:62px;height:62px;border-radius:50%;background:#efe9f1;color:#c2b8c8;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;margin-left:4px}
/* ---------------- 模拟广告 */
#ad{position:absolute;inset:0;z-index:60;background:linear-gradient(160deg,#2b2350,#4b2d6e);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#ad .adTag{position:absolute;top:calc(var(--safeT) + 14px);left:14px;font-size:12px;font-weight:800;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:10px}
#ad .adX{position:absolute;top:calc(var(--safeT) + 10px);right:12px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-size:22px;font-weight:900}
#ad h3{margin:0;font-size:24px}
#ad .ring{width:110px;height:110px;border-radius:50%;border:8px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;position:relative}
#ad p{margin:0;opacity:.85;font-weight:600;line-height:1.5}
#ad.inter{background:linear-gradient(160deg,#18304a,#205a6e)}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#toast div{background:rgba(60,30,55,.88);color:#fff;font-weight:800;font-size:15px;padding:9px 16px;border-radius:16px;animation:toast 1.8s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.flycoin{position:absolute;width:26px;height:26px;z-index:65;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#d9ebff,#ffe9f3);z-index:80;font-weight:900;color:#e8649a;font-size:20px;flex-direction:column;gap:12px}
#loading .dots{display:flex;gap:8px}
#loading .dots i{width:16px;height:16px;border-radius:50%;background:#936044;animation:bob .9s ease-in-out infinite}
#loading .dots i:nth-child(2){animation-delay:.15s;background:#6db552}#loading .dots i:nth-child(3){animation-delay:.3s;background:#f86aa8}
@keyframes bob{50%{transform:translateY(-10px)}}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:800;line-height:1.6;background:#cfe8ff;z-index:90}
@media (min-width:700px) and (min-height:600px){#hud .top{max-width:760px;margin:0 auto}}
@media (max-height:620px){.card.result .big{font-size:28px;margin:2px 0}.thingName{font-size:17px}.card{padding:16px 16px 16px}.tool{height:60px;width:66px}.tool svg{width:24px;height:24px}#progWrap{top:calc(var(--safeT) + 54px)}#tip{top:calc(var(--safeT) + 86px);font-size:13px}}
</style>
</head>

  <canvas id="gl" tabindex="0"></canvas>

    </div>
  </div>
  <div id="home" class="screen hidden">
    <div class="logo"><h1>刷刷焕新<small>小怪兽来吃脏啦</small></h1><p>叫对怪兽 · 吃掉脏东西 · 旧物焕然一新</p></div>
    <div class="homeBtns">
      <button class="btn big mint" id="btnPlay">开始第 1 关</button>
      <div class="homeRow">
        <button class="btn pink small" id="btnShop">装扮<i class="dot hidden"></i></button>
        <button class="btn lav small" id="btnAlbum">相册</button>
        <button class="btn sky small" id="btnLevels">关卡</button>
      </div>
      <div class="homeRow">
        <button class="btn sun small" id="btnGuide">怪兽图鉴</button>
        <button class="btn ghost small" id="btnSettings">设置</button>
      </div>
    </div>
  </div>
  <div id="pointer" class="hidden"><svg viewBox="0 0 64 64"><path d="M24 30V10a5 5 0 0 1 10 0v16l12 3.5a6 6 0 0 1 4.2 7l-2.6 13A8 8 0 0 1 39.8 56H30a8 8 0 0 1-6.4-3.2L13 38.5a4.5 4.5 0 0 1 6.6-6.1z" fill="#fff" stroke="#4a3048" stroke-width="3.5" stroke-linejoin="round"/></svg></div>

  <div id="toast"></div>
  <div id="ad" class="hidden"><span class="adTag">模拟广告 · 不联网 · 不扣费</span><button class="adX" id="adX">✕</button><h3 id="adTitle">看完视频领取奖励</h3><div class="ring" id="adRing">3</div><p id="adText"></p><button class="btn mint hidden" id="adClaim">领取奖励</button></div>
  <div id="loading"><div class="dots"><i></i><i></i><i></i></div><div>小怪兽们正在赶来…</div></div>
</div>
